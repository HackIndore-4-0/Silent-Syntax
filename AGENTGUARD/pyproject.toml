[project]
name = "agentguard"
version = "0.4.0"
description = "Phase 4 replay, CLI & auto-improve: a low-code reliability SDK for autonomous AI agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.4",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "asyncpg>=0.29",
    "typer>=0.12",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
llm = ["anthropic>=0.34"]
otel-otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24"]
dspy = ["dspy>=3.0"]
mcp = ["fastmcp>=2.0"]
litellm = ["litellm>=1.0"]
deepeval = ["deepeval>=2.0"]
ragas = ["ragas>=0.4"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.0"]
mongo = ["motor>=3.0"]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
